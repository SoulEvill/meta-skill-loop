name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s bash install.sh tests/run.sh skills/meta-skill-loop/scripts/msl

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          - os: macos-latest
            bash: /bin/bash # macOS ships bash 3.2; this is what most Cursor users run
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: ${{ matrix.bash }} --version | head -1
      - run: TEST_BASH=${{ matrix.bash }} ${{ matrix.bash }} tests/run.sh
